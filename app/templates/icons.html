{#- Inline SVG icon set. Hand-drawn geometry, 1.75px stroke, 24×24 grid.

<path d="M2 12h4l2.5-7 5 14L16 12h6"/>

<path d="M2 7.5A1.5 1.5 0 0 1 3.5 6H13v10H2z"/><path d="M13 9.5h3.8L21 13v3h-8z"/><circle cx="6.5" cy="17.8" r="1.7"/><circle cx="16.8" cy="17.8" r="1.7"/><path d="M7 9v3.5M5.2 10.8h3.6"/>

  <path d="M6.5 17h3.8l2.4-6.2 4.2 12.4 2.9-8 1.7 3.3h4" fill="none" stroke="#f6f3ec" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

{%- endmacro -%}
